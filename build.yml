name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Ekstrak project
        run: unzip -q project.zip -d src_project

      - name: Build APK
        working-directory: src_project
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Simpan sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: DynamicIsland-APK
          path: src_project/app/build/outputs/apk/debug/app-debug.apk

      - name: Buat rilis supaya APK mudah diunduh
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: src_project/app/build/outputs/apk/debug/app-debug.apk
